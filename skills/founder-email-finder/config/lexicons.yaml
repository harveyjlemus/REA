# Word lists the code uses. Edit freely; the tests pin the behavior that matters.

# Titles that make someone "the founder" for this tool, strongest first.
# rank 1 wins over rank 2, and so on. Matching ignores case.
founder_titles:
  1: [founder, co-founder, cofounder, co founder, owner, co-owner, coowner, sole proprietor, proprietor]
  2: [president, ceo, chief executive officer, chief executive, principal, managing principal]
  3: [managing partner, managing member, managing director, partner, operator, owner/operator]
  4: [general manager, gm, vice president, vp]

# People ranked above this are listed in other_people but never picked as "the founder".
founder_max_rank: 3

# Local parts that are an inbox, not a person.
