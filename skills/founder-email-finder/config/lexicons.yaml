  co.nz, com.br, com.mx, com.ar, co.za, co.in, com.sg, com.hk, co.jp, com.tr, com.cn, com.tw,
  co.il, com.my, com.ph, com.pk, com.co, com.pe, com.ve]

# Text that means a domain is parked, for sale, or a placeholder.
parked_markers: ["domain is for sale", "buy this domain", "this domain may be for sale",
  "domain for sale", "hugedomains", "sedo.com", "dan.com", "afternic", "parkingcrew",
  "bodis.com", "this domain has been registered", "future home of something quite cool",
  "domain name is parked", "parked free", "godaddy.com/domainsearch", "this site is parked",
  "domain has expired", "this domain is parked", "inquire about this domain"]

# Text that means a bot wall or challenge page.
botwall_markers: ["cf-chl", "challenge-platform", "just a moment...", "attention required! | cloudflare",
  "cf-browser-verification", "px-captcha", "/_incapsula_resource", "ddos protection by",
  "request unsuccessful. incapsula", "are you a robot", "verify you are human",
  "sucuri website firewall", "checking your browser before accessing", "g-recaptcha",
  "hcaptcha", "access to this page has been denied"]

# Markup that means the page is empty until JavaScript runs.
js_shell_markers: ['<div id="root"></div>', '<div id="app"></div>', '<div id="__next"></div>',
  "you need to enable javascript", "please enable javascript", "javascript is required",
  "this app works best with javascript"]

# Words in a link or URL that point at a page likely to name the owner.
# Earlier groups are fetched first.
subpage_keywords:
  - [about, about-us, aboutus, our-story, story, who-we-are, history, company]
  - [team, our-team, meet, staff, leadership, people, founder, owner, management]
  - [contact, contact-us, contactus]

# Fallback paths tried when the homepage links to nothing useful.
subpage_fallback_paths: [/about, /about-us, /team, /contact, /contact-us]

